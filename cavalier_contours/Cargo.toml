[package]
name = "cavalier_contours"
description = "2D polyline/shape library for offsetting, combining, etc."
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
# Enable serde serialize/deserialize for polylines and vertexes
serde = ["dep:serde"]
# Enable unsafe optimizations in the static_aabb2d_index dependency
unsafe_optimizations = ["static_aabb2d_index/unsafe_optimizations"]

[dependencies]
# Use fixed seeds because getrandom has no default wasm32-unknown-unknown backend.
# Random seeding to prevent linear probing from malicious inputs is not relevant because
# the geometric algorithms can already degrade linear lookups naturally (points/segments
# stacked within same small x/y area).
ahash = { version = "0.8", default-features = false, features = ["std", "no-rng"] }
num-traits = "0.2"
serde = {version = "1.0", optional = true, features = ["derive"]}
smallvec = "1.15"
static_aabb2d_index = "2.1"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
harness = false
name = "benches"
